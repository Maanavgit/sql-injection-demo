services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: sql-demo-frontend

    ports:
      - "8096:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    mem_limit: 128m

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sql-demo-backend

    ports:
      - "8086:80"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    mem_limit: 256m

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  db:
    build:
      context: ./database
      dockerfile: Dockerfile

    container_name: sql-demo-db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

    mem_limit: 512m

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  mysql_data:
